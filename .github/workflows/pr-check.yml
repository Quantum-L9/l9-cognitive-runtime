name: pr-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff
        run: uv run --no-build ruff check src tests
      - name: Pytest
        run: uv run --no-build pytest -q
      - name: Build
        run: uv run --no-build python -m build
