name: release-staging

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging

permissions:
  contents: read

jobs:
  analysis:
    name: Canonical release analysis
    # Core pinned to the immutable revision that carries the blocking finding
    # policy and the strict release profile (l9-ci-core #218, #221, #223).
    # This is neither the organization-required workflow nor release evidence.
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@edf799046023f44dae3bb8aad9aa91247124706b
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      # Explicit class: without it Core maps workflow_dispatch to `nightly`,
      # which the `release` profile does not admit.
      event: release
      profile: release
      matrix-id: release-semgrep
      language: python

  release:
    name: Publish immutable image and dispatch staging request
    needs: analysis
    if: >-
      needs.analysis.outputs.gate-status == 'pass' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Verify release source
        run: |
          set -euo pipefail
          uv sync --extra dev --frozen --no-install-project --no-build
          export PYTHONPATH=src
          uv run --no-sync --no-build ruff check src tests
          uv run --no-sync --no-build ruff format --check src tests
          uv run --no-sync --no-build mypy src tests
          uv run --no-sync --no-build python -m pytest -q
          # Intentional, explicit build. No implicit build is permitted above.
          uv run --no-sync --no-build python -m build
      - name: Publish and request deployment
        # Core main after l9-ci-core #224 (build context no longer passed in DOCKER_CONTEXT).
        uses: Quantum-L9/l9-ci-core/.github/actions/container-release@8f301c97fb81251e530f3fac52d27230ab409014
        with:
          deployment-profile: .l9/deployment.yaml
          registered-profile-path: integrations/consumers/l9-cognitive-runtime.deployment.yaml
          image-repository: ghcr.io/quantum-l9/l9-cognitive-runtime
          environment: ${{ inputs.environment }}
          analysis-artifact: ${{ needs.analysis.outputs.artifact-name }}
          matrix-id: release-semgrep
          source-revision-build-arg-name: L9_SOURCE_REVISION
          github-token: ${{ github.token }}
          deployment-broker-token: ${{ secrets.DEPLOYMENT_BROKER_TOKEN }}
