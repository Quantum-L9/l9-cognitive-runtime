name: sonar-diagnostic

on:
  push:
    branches:
      - diag/sonar-security

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List current SonarCloud vulnerabilities compactly
        env:
          PROJECT: Quantum-L9_l9-cognitive-runtime
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            --data-urlencode "componentKeys=${PROJECT}" \
            --data-urlencode "branch=main" \
            --data-urlencode "resolved=false" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "ps=100" \
            https://sonarcloud.io/api/issues/search \
            | jq -r '
                .issues
                | sort_by(.rule, .component, (.line // 0))
                | .[]
                | [
                    .rule,
                    .severity,
                    ((.impacts // []) | map(.severity) | join(",")),
                    (.component | sub("^Quantum-L9_l9-cognitive-runtime:"; "")),
                    ((.line // 0) | tostring),
                    (.message | gsub("[\t\r\n]+"; " "))
                  ]
                | @tsv'
