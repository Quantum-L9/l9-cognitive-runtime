# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
schema: l9.deployment-profile/v2
project:
  id: l9-cognitive-runtime
  repository: Quantum-L9/l9-cognitive-runtime
  owner_team: platform
  runtime_profile: container-service
artifact:
  registry: ghcr.io
  image: ghcr.io/quantum-l9/l9-cognitive-runtime
runtime:
  architecture: linux/amd64
  container_port: 8080
  user: non_root
  read_only_root_filesystem: true
  stop_grace_seconds: 30
  environment:
    L9_ALLOWED_HOSTS: mcp-staging.quantumaipartners.com
    L9_REQUIRE_AUTH: "true"
    L9_MCP_RESOURCE_URL: https://mcp-staging.quantumaipartners.com/v1/mcp
health:
  startup:
    type: http
    path: /readyz
    expected_status: 200
    timeout_seconds: 10
    interval_seconds: 5
    attempts: 24
  post_deploy:
    type: http
    path: /readyz
    expected_status: 200
    timeout_seconds: 10
    interval_seconds: 5
    attempts: 12
release:
  strategy: replace
  automatic_rollback: true
  stabilization_seconds: 30
migrations:
  enabled: false
  backup_required: false
secrets:
  authority: infisical
  runtime_mode: deploy_render
  project_slug: l9-cognitive-runtime
targets:
  # C1 is a shared, protected host (Cursor-Governance rules/93-c1-server-protection).
  # docker: verify checks its existing Docker runtime without changing it. Caddy
  # already terminates TLS on C1; l9-deploy adds only this release's site file under
  # /etc/caddy/sites and refuses to run unless the host Caddyfile imports that
  # directory. host_port keeps the container off ports other C1 services bind.
  staging:
    server:
      address: 46.62.243.82
      ssh:
        user: root
        port: 22
      host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICMwpLXB2J962/OrrUqXNGwiHb39e7f9jSKixo97xJxU
    host:
      docker: verify
      backup_tools: none
    ingress:
      mode: caddy
      hostnames:
        - mcp-staging.quantumaipartners.com
      host_port: 18080
    allowed_source_refs:
      - refs/heads/main
    secrets_environment: staging
