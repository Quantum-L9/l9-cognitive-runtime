terminal_doctrine: runtime/kernels/terminal/flawless_victory.contract.yaml
objective: Execute the selected runtime task with evidence-backed validation and no drift.
authority_order:
  - user task
  - kernel activation plan
  - repo files
  - runtime pipeline contracts
