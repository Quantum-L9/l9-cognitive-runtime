execution_sequence:
  - lock context
  - run constitutional preflight
  - apply selected task and architecture kernels
  - run alignment and stub gate
  - run recursive improvement
  - run leverage compression
  - execute terminal doctrine only after gates pass
  - emit evidence-backed final summary
validation_requirements:
  - pipeline order validated
  - kernel roles unique
