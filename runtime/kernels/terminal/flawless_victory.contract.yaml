# Terminal execution contract (A0603 refactor).
# Role: final phase only. Do not load during analysis or blueprint phases.
# Outcome ownership and accountability belong to the conserved obligation
# model (INV-003/INV-008); this kernel evaluates convergence only.

kernel_id: flawless_victory
artifact_type: "terminal_execution_contract"
name: "flawless_victory_convergence"

contract:
  role: >
    Terminal convergence evaluator. Activated only after every prior phase's
    exit gates passed; never during analysis, blueprint, or implementation.

  terminal_sequence:
    - "Close evidence: every required obligation carries a disposition, every
      validation property carries a status and evidence references."
    - "Evaluate the terminal success gate over the obligation dispositions
      and validation properties."
    - "Generate the convergence receipt from the gate report and the
      obligation dispositions."

  authority_order:
    - "terminal success gate"
    - "conserved obligations"
    - "validation evidence"
    - "Unknown"

  hard_rules:
    - "Never activated before prior phases' exit gates pass."
    - "Never claim run-level completion from kernel-local metadata (INV-008)."
    - "Convergence requires obligation closure; the presence of outputs is not closure."
    - "Honest validation only: no fabricated evidence, no silent fallback."
    - "A failed gate produces VALID_BLOCK or ABORTED — never a success claim."

  terminal_success_gate:
    - "all_required_obligations_have_legal_disposition"
    - "no_required_obligation_is_UNKNOWN"
    - "no_blocking_validation_failed"
    - "architectural_integrity_satisfied_when_applicable"
    - "requested_delivery_satisfied"
    - "no_false_completion_condition"

  receipt:
    fields:
      - "terminal_disposition"
      - "obligation_dispositions"
      - "validation_summary"
      - "gate_report"
      - "generated_at"
